amcl:
  ros__parameters:

    use_sim_time: true

    # TF frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint

    # Topics
    scan_topic: /scan
    map_topic: /map

    # Robot model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Laser model
    laser_model_type: "likelihood_field"

    # -1 means use the actual limits reported by /scan
    laser_min_range: -1.0
    laser_max_range: -1.0

    # Your LiDAR now provides substantially more useful scan information
    max_beams: 180

    # Particle filter
    min_particles: 1000
    max_particles: 3000

    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Odometry noise model
    # Keep moderate values until the wheel odometry is independently verified.
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20

    # Laser likelihood model
    z_hit: 0.80
    z_rand: 0.20

    z_short: 0.05
    z_max: 0.05

    sigma_hit: 0.15
    lambda_short: 0.10

    laser_likelihood_max_dist: 2.0

    # Update AMCL after smaller robot motions
    update_min_d: 0.05
    update_min_a: 0.05

    # TF
    tf_broadcast: true
    transform_tolerance: 1.0

    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Initial pose is supplied through /initialpose or RViz
    set_initial_pose: true
    always_reset_initial_pose: false

    initial_pose:
      x: 0.0
      y: 5.0
      z: 0.0
      yaw: 0.0

    # Disable beam skipping initially because the new scan is behaving well
    do_beamskip: false